<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AL Desk">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='Impact,Arial Narrow,sans-serif' font-size='30' fill='%23e8eaea' text-anchor='middle' font-style='italic'%3EAL%3C/text%3E%3Crect y='58' width='64' height='6' fill='%23D7191F'/%3E%3C/svg%3E">
<title>Arctic Leopard Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
:root{
  --ground:#F3F4F5; --surface:#FFFFFF; --surface-2:#F7F8F9; --raise:#EEF0F2; --ink:#0B0B0C; --muted:#5C6368; --faint:#8C9399;
  --line:#E1E4E7; --line-strong:#C6CBD0; --accent:#D7191F; --accent-hi:#EC3238; --accent-dark:#A80F14; --accent-ink:#FFFFFF; --accent-soft:rgba(215,25,31,.10);
  --band:#000; --band-ink:#FAFAFA; --band-muted:#A9A9A9; --band-line:#252525;
  --chrome:linear-gradient(180deg,#FFFFFF 0%,#E4E6E8 34%,#8A9096 50%,#D5D8DB 66%,#FFFFFF 84%,#AEB3B8 100%);
  --red:#CF3A31; --red-bg:#FCE8E6; --amber:#B07212; --amber-bg:#FBF0DC; --green:#2F7D1A; --green-bg:#E7F3DF;
  --teal:#12807E; --teal-bg:#DDF3F2; --blue:#2263B8; --blue-bg:#E3EDFA; --purple:#6B45C2; --purple-bg:#EFE9FB; --grey:#5C6368; --grey-bg:#ECEEEF;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif; --brand:"Anton","Impact","Arial Narrow Bold",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding:0 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto}
.band{background:var(--band);color:var(--band-ink);margin:0 -16px 18px;padding:0 16px;border-bottom:3px solid var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.wm{font-family:var(--brand);font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand h1{margin:0;font-weight:500;font-size:19px;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--band-muted);font-size:12.5px}
.divider{width:1px;align-self:stretch;background:var(--band-line)}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--band-muted);font-size:12.5px}
.band .btn{border-color:#555;color:var(--band-ink)}
.band .btn:hover{background:var(--band-ink);color:var(--band)}
.btn{border:1px solid var(--ink);background:transparent;border-radius:0;padding:8px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--ground)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:transparent;color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;margin-bottom:14px;overflow-x:auto;border-bottom:1px solid var(--line-strong)}
.tabs button{border:0;background:none;padding:10px 14px 11px;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .c{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 7px;letter-spacing:0}
.tabs .c.alert{background:var(--red);border-color:var(--red);color:#fff}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.stat{background:var(--surface);border:0;text-align:left;padding:10px 14px 11px;display:flex;flex-direction:column;gap:2px}
.stat:hover{background:var(--surface-2)}
.stat .n{font-weight:300;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat.alert .n{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line)}
.panel>h3{margin:0;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>h3 small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.panel .empty{padding:18px 12px;color:var(--faint);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;min-width:0}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:0}
.tools select{padding:8px 10px;border:1px solid var(--line-strong);background:var(--surface);border-radius:0;max-width:200px}
.tablewrap{background:var(--surface);border:1px solid var(--line);overflow-x:auto}
table{border-collapse:collapse;width:100%}
.tablewrap table{min-width:860px}
.panel table{min-width:0}
th{font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--faint)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5;background:var(--pb,var(--grey-bg));color:var(--pc,var(--grey))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;border:1px solid var(--line-strong);background:var(--raise);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;line-height:1.6;white-space:nowrap}
.low{color:var(--red);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.state{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong)}
.state strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line-strong);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.drawer.wide{width:min(820px,100%)}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:8px}
.dr-h h2{margin:0;font-size:21px;font-weight:500}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.dr-b>*{flex-shrink:0}
.dr-f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.x{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:4px 8px}
.x:hover{background:var(--surface-2);color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:0;padding:8px 10px;background:var(--surface)}
.field input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent-dark)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.checkrow{display:flex;align-items:center;gap:8px;font-weight:500}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:8px}
.checks input{width:18px;height:18px;accent-color:var(--green)}
.section{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.section h4{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.plines{display:flex;flex-direction:column;gap:6px}
.pline{display:grid;grid-template-columns:minmax(0,1fr) 60px 120px 110px 28px;gap:6px;align-items:center}
.pline input,.pline select{border:1px solid var(--line-strong);padding:6px 8px;background:var(--surface);min-width:0;width:100%;border-radius:0}
.rm{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:4px}
.rm:hover{color:var(--red)}
.media{display:flex;flex-wrap:wrap;gap:8px}
.media a{display:block;width:96px;height:96px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;position:relative;font-size:11px;color:var(--muted);text-decoration:none;overflow:hidden}
.media a span{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.events{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted)}
.events li{padding:3px 0;border-bottom:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.toast{border-left:4px solid var(--accent);position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;font-weight:500;z-index:40;max-width:90vw}
.toast.err{border-left-color:var(--red)}
/* login */
.login{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-size:20px;font-weight:500}
.login p{margin:0;color:var(--muted);font-size:13px}
.login .err{color:var(--red);font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-dark);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:2px}
@media (max-width:1100px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){
  .wm{font-size:26px}.divider{display:none}.brand h1{font-size:17px}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .n{font-size:26px}
  .form,.checks{grid-template-columns:1fr}
  .tools select{flex:1 1 40%;max-width:none}
  .pline{grid-template-columns:1fr 60px 28px}.pline .ps,.pline .pst{grid-column:span 1}
}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <div class="brand">
      <span class="wm">Arctic Leopard</span>
      <span class="divider"></span>
      <div><h1>Australia Desk</h1><p>Stock, dealers and warranty</p></div>
    </div>
    <div class="hdr-right" id="hdrRight" hidden>
      <span id="who"></span>
      <button class="btn sm" id="refreshBtn" title="Reload data">Refresh</button>
      <button class="btn sm" id="logoutBtn">Sign out</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"><div class="state"><strong>Loading…</strong></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
const SB_URL = "https://dobonmovezqepjgzfwmt.supabase.co";
const SB_KEY = "sb_publishable_pfAU4aKvfy_-ocIVv2aCXQ_E1dCUgAw"; // publishable key: safe in the page, data is protected by row-level security + staff list
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const BUCKET = "al-warranty";

/* ---------- labels ---------- */
const BIKE_ST = {in_transit:["In transit","--blue"],in_stock:["In stock","--teal"],pdi_done:["PDI done","--green"],reserved:["Reserved","--purple"],sold_retail:["Sold retail","--grey"],to_dealer:["With dealer","--amber"],demo:["Demo","--blue"],warranty_hold:["Warranty hold","--red"],written_off:["Written off","--grey"]};
const SHIP_ST = {ordered:["Ordered","--grey"],deposit_paid:["Deposit paid","--amber"],balance_paid:["Balance paid","--amber"],shipped:["Shipped","--blue"],arrived:["Arrived","--purple"],received:["Received","--green"],cancelled:["Cancelled","--grey"]};
const CLAIM_ST = {new:["New","--red"],assessing:["Assessing","--amber"],parts_requested:["Parts requested","--blue"],parts_received:["Parts received","--purple"],repaired:["Repaired","--teal"],closed:["Closed","--green"],rejected:["Rejected","--grey"]};
const DEALER_ST = {prospect:["Prospect","--amber"],active:["Active","--green"],paused:["Paused","--grey"],ended:["Ended","--grey"]};
const PRE_ST = {enquiry:["Enquiry","--grey"],deposit_paid:["Deposit paid","--amber"],allocated:["Bike allocated","--blue"],delivered:["Delivered","--green"],cancelled:["Cancelled","--grey"],refunded:["Refunded","--grey"]};
const WP_ST = {needed:"Needed",requested:"Requested",received:"Received",fitted:"Fitted"};
const CATS = ["motor","battery","controller","charger","suspension","brakes","frame","electrical","drivetrain","plastics","other"];
const MOVE_KINDS = {received:["Received",1],sold_retail:["Sold retail",-1],to_dealer:["To dealer",-1],warranty:["Used on warranty",-1],returned:["Returned",1],adjustment:["Adjustment (+/-)",0]};
const STATES = ["WA","NSW","VIC","QLD","SA","TAS","ACT","NT"];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => v == null ? "" : String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g," ") : "";
const money = (v, d=0) => v == null || v === "" ? "" : "$" + Number(v).toLocaleString("en-AU",{minimumFractionDigits:d,maximumFractionDigits:d});
const num = v => v == null ? "" : Number(v).toLocaleString("en-AU");
const fdate = d => d ? new Date(d + (String(d).length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"2-digit"}) : "";
const aud = (usd, fx) => usd == null ? null : Math.round(usd * (fx || 1.4243) * 100) / 100;
const today = () => new Date().toLocaleDateString("en-CA");
const pill = (map, k) => { const m = map[k] || [cap(k),"--grey"]; return `<span class="pill" style="--pc:var(${m[1]});--pb:var(${m[1]}-bg)">${esc(m[0])}</span>`; };
const byId = (arr, id) => arr.find(x => x.id === id);
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2600); }
async function q(p) { const { data, error } = await p; if (error) { console.error(error); throw new Error(error.message); } return data; }
function guard(fn) { return async (...a) => { try { await fn(...a); } catch (e) { toast(e.message || String(e), true); } }; }

/* ---------- state ---------- */
const S = { tab: localGet("al.tab") || "overview", f: {}, d: {} };
function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function loadAll() {
  const t = n => sb.from(n).select("*");
  const [models, dealers, customers, shipments, lines, parts, bikes, claims, wparts, preorders, pdi, orders] = await Promise.all([
    q(t("al_models").order("id")), q(t("al_dealers").order("business_name")), q(t("al_customers").order("full_name")),
    q(t("al_shipments").order("invoice_date", { ascending: false })), q(t("al_shipment_lines").order("id")),
    q(t("al_part_stock").order("name")), q(t("al_bikes").order("id")), q(t("al_warranty_claims").order("id", { ascending: false })),
    q(t("al_warranty_parts").order("id")), q(t("al_preorders").order("id", { ascending: false })), q(t("al_pdi")), q(t("al_shopify_orders").order("processed_at", { ascending: false }).limit(50))
  ]);
  Object.assign(S.d, { models, dealers, customers, shipments, lines, parts, bikes, claims, wparts, preorders, pdi, orders });
}
const model = id => byId(S.d.models, id) || {};
const bikeNo = b => S.d.bikes.filter(x => x.model_id === b.model_id && x.id <= b.id).length;
const bikeLabel = b => b ? `${model(b.model_id).name || "Bike"} #${bikeNo(b)}${b.frame_no ? " · " + b.frame_no : ""}` : "";
const dealerName = id => (byId(S.d.dealers, id) || {}).business_name || "";
const claimFrame = c => c.reported_frame_no || (byId(S.d.bikes, c.bike_id) || {}).frame_no || "";
const claimModel = c => model(c.model_id || (byId(S.d.bikes, c.bike_id) || {}).model_id).name || c.reported_model || "";
const custName = id => (byId(S.d.customers, id) || {}).full_name || "";

/* ---------- auth ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (location.hash.includes("type=recovery")) return showLogin("reset");
  if (!session) return showLogin("in");
  const ok = await sb.rpc("al_is_staff");
  if (ok.error || !ok.data) {
    $("#app").innerHTML = `<div class="login"><h2>No access yet</h2><p>You're signed in as <b>${esc(session.user.email)}</b>, but that email isn't on the Arctic Leopard staff list. Ask SHAR to add it.</p><button class="btn" id="lo2">Sign out</button></div>`;
    $("#lo2").onclick = async () => { await sb.auth.signOut(); boot(); };
    return;
  }
  $("#hdrRight").hidden = false; $("#who").textContent = session.user.email;
  $("#app").innerHTML = `<div class="state"><strong>Loading data…</strong></div>`;
  await loadAll(); render();
}
function showLogin(mode) {
  $("#hdrRight").hidden = true;
  const titles = { in: "Sign in", up: "Create your login", forgot: "Reset password", reset: "Set a new password" };
  $("#app").innerHTML = `<form class="login" id="lf">
    <h2>${titles[mode]}</h2>
    ${mode === "up" ? `<p>Use the email SHAR added to the staff list. You'll get an email to confirm it.</p>` : ""}
    ${mode === "forgot" ? `<p>We'll email you a link to set a new password.</p>` : ""}
    ${mode !== "reset" ? `<div class="field"><label for="le">Email</label><input id="le" type="email" autocomplete="username" required></div>` : ""}
    ${mode !== "forgot" ? `<div class="field"><label for="lp">${mode === "reset" ? "New password" : "Password"}</label><input id="lp" type="password" autocomplete="${mode === "in" ? "current-password" : "new-password"}" minlength="8" required></div>` : ""}
    <div class="err" id="lerr"></div>
    <button class="btn primary" type="submit">${titles[mode]}</button>
    ${mode === "in" ? `<div style="display:flex;justify-content:space-between"><button type="button" class="linkbtn" data-m="up">Create a login</button><button type="button" class="linkbtn" data-m="forgot">Forgot password?</button></div>` : mode !== "reset" ? `<button type="button" class="linkbtn" data-m="in">Back to sign in</button>` : ""}
  </form>`;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => showLogin(b.dataset.m));
  $("#lf").onsubmit = async e => {
    e.preventDefault(); const em = $("#le") && $("#le").value.trim().toLowerCase(), pw = $("#lp") && $("#lp").value; const err = $("#lerr"); err.textContent = "";
    const redirect = location.origin + location.pathname;
    let r;
    if (mode === "in") r = await sb.auth.signInWithPassword({ email: em, password: pw });
    else if (mode === "up") r = await sb.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: redirect } });

/* generic fields: [key,label,type,opts] type: text|email|tel|number|date|textarea|select|check */
function fieldsHtml(fields, rec, prefix = "f_") {
  return `<div class="form">${fields.map(([k, label, type = "text", opts = {}]) => {
    const v = rec[k] ?? opts.def ?? "";

    if (type === "textarea") input = `<textarea id="${id}">${esc(v)}</textarea>`;
    else if (type === "select") input = `<select id="${id}">${opts.blank !== false ? `<option value="">${esc(opts.blank || "—")}</option>` : ""}${(opts.groups || [["", opts.options]]).map(([gl, os]) => (gl ? `<optgroup label="${esc(gl)}">` : "") + os.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v) ? " selected" : ""}>${esc(ol)}</option>`).join("") + (gl ? "</optgroup>" : "")).join("")}</select>`;
    else if (type === "check") input = `<label class="checkrow"><input type="checkbox" id="${id}"${v ? " checked" : ""}> ${esc(opts.text || "")}</label>`;
    else input = `<input id="${id}" type="${type}"${type === "number" ? ` step="${opts.step || "any"}"` : ""} value="${esc(v)}"${opts.ph ? ` placeholder="${esc(opts.ph)}"` : ""}${opts.list ? ` list="${opts.list}"` : ""}>`;
    return `<div class="field${full}"><label for="${id}">${esc(label)}</label>${input}</div>`;
  }).join("")}</div>`;
}
function readFields(fields, prefix = "f_") {
  const o = {};
  for (const [k, , type = "text", opts = {}] of fields) {
    const el = document.getElementById(prefix + k); if (!el || opts.ro) continue;
    if (type === "check") o[k] = el.checked;
    else { const v = el.value.trim(); o[k] = v === "" ? null : (type === "number" || opts.int) ? Number(v) : v; }
  }
  return o;
}

function downloadXlsx(name, sheets, title) {
  if (!window.XLSX) return toast("Excel library didn't load; refresh the page", true);
  const wb = XLSX.utils.book_new();
  for (const [sn, rows] of sheets) {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "": "Nothing to show" }], title && sn === sheets[0][0] ? { origin: "A3" } : undefined);
    if (title && sn === sheets[0][0]) XLSX.utils.sheet_add_aoa(ws, [[title], ["Generated " + new Date().toLocaleDateString("en-AU")]], { origin: "A1" });
    const keys = Object.keys(rows[0] || {}); ws["!cols"] = keys.map(k => ({ wch: Math.min(60, Math.max(k.length, ...rows.map(r => String(r[k] ?? "").split("\n")[0].length)) + 2) }));
    XLSX.utils.book_append_sheet(wb, ws, sn);
  }
  XLSX.writeFile(wb, name);
}

  armDelete(dr, async () => { await q(sb.from(table).delete().eq("id", id)).catch(() => { throw new Error(`This ${noun} is linked to bikes, claims or stock records, so it can't be deleted`); }); });
}
const PRE_F = () => [["status","Status","select",{options:opt(PRE_ST),blank:false}],["model_id","Model","select",{options:modelOpts(),blank:false,int:1}],["customer_id","Customer","select",{options:custOpts(),int:1}],["dealer_id","Or dealer","select",{options:dealerOpts(),int:1}],["agreed_price_aud","Agreed price AUD","number"],["deposit_aud","Deposit AUD","number"],["deposit_date","Deposit date","date"],["shopify_order","Shopify order no."],["bike_id","Allocated bike","select",{groups:bikeGroups(b => ["in_transit","in_stock","pdi_done","reserved"].includes(b.status)),int:1,full:1}],["notes","Notes","textarea"]];
VIEWS.preorders = () => {
  const d = S.d;
  view(`<div class="tools"><p class="hint" style="margin:0;flex:1">Deposits taken ahead of bikes landing. Allocating a bike marks it Reserved for that customer.</p><button class="btn primary" id="newP">+ Pre-order</button></div>
  <div class="tablewrap"><table><thead><tr><th>Who</th><th>Model</th><th>Status</th><th class="r">Deposit</th><th>Paid</th><th class="r">Price</th><th>Bike</th></tr></thead><tbody>
  ${d.preorders.map(p => `<tr class="click" data-id="${p.id}"><td><b>${esc(custName(p.customer_id) || dealerName(p.dealer_id) || "—")}</b></td><td>${esc(model(p.model_id).name)} <span class="small muted">${esc(p.colour || "")}</span></td><td>${pill(PRE_ST, p.status)}</td><td class="r">${money(p.deposit_aud)}</td><td class="small">${fdate(p.deposit_date)}</td><td class="r">${money(p.agreed_price_aud)}</td><td class="small">${p.bike_id ? esc(bikeLabel(byId(d.bikes, p.bike_id))) : `<span class="muted">Not allocated</span>`}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No pre-orders yet.</td></tr>`}</tbody></table></div>`);
  $("#newP").onclick = () => openPreorder(null);
  document.querySelectorAll("tr[data-id]").forEach(r => r.onclick = () => openPreorder(+r.dataset.id));
};
function openPreorder(id) {
  const p = id ? byId(S.d.preorders, id) : { status: "deposit_paid", deposit_date: today() };
  const dr = drawer({ title: id ? "Pre-order" : "New pre-order", body: fieldsHtml(PRE_F(), p), foot: `${id ? delBtn() : "<span></span>"}<button class="btn primary" id="saveBtn">Save</button>` });
  dr.querySelector("#saveBtn").onclick = guard(async () => {
    const row = readFields(PRE_F());
    if (row.bike_id) { const b = byId(S.d.bikes, row.bike_id); if (b.model_id !== row.model_id) throw new Error("That bike is a different model"); if (row.status === "deposit_paid" || row.status === "enquiry") row.status = "allocated"; }
    await saveRow("al_preorders", id, row);
    if (row.bike_id && row.status === "allocated") await q(sb.from("al_bikes").update({ status: "reserved", customer_id: row.customer_id, dealer_id: row.dealer_id }).eq("id", row.bike_id).in("status", ["in_transit","in_stock","pdi_done","reserved"]));
    if (p.bike_id && p.bike_id !== row.bike_id) await q(sb.from("al_bikes").update({ status: "in_stock", customer_id: null }).eq("id", p.bike_id).eq("status", "reserved"));
    closeDrawer(); await rerender(); toast("Saved");
  });
  armDelete(dr, async () => { await q(sb.from("al_preorders").delete().eq("id", id)); });
}

sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") showLogin("reset"); });
boot().catch(e => { $("#app").innerHTML = `<div class="state"><strong>Couldn't load</strong>${esc(e.message)}</div>`; });
</script>
